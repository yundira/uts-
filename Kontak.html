<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak | Campus Freelancer Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }
    </style>
<!-- </head> -->

<body class="text-gray-800">
<div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-white p-6 hidden md:block">
        <h1 class="text-xl font-bold mb-10">
            Campus Freelancer
        </h1>

        <nav class="space-y-3">
            <a href="beranda.html" class="block p-3 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-house mr-2"></i> Beranda
            </a>
            <a href="freelance.html" class="block p-3 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-users mr-2"></i> Freelancer
            </a>
            <a href="profil.html" class="block p-3 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-user mr-2"></i> Profil
            </a>
            <a href="kontak.html" class="block p-3 rounded-lg bg-blue-600">
                <i class="fa-solid fa-envelope mr-2"></i> Kontak
            </a>
            <a href="pesan.html" class="block p-3 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-inbox mr-2"></i> Pesan Masuk
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-6 md:p-10">

        <div class="mb-8">
            <h2 class="text-3xl font-bold">Hubungi Kami</h2>
            <p class="text-gray-500 mt-2">
                Kirim pertanyaan, kritik, atau saran kepada Campus Freelancer Network.
            </p>
        </div>

        <div class="max-w-3xl bg-white rounded-2xl shadow-sm border p-6 md:p-8">

            <div id="successMessage"
                class="hidden mb-6 p-4 bg-green-100 text-green-700 rounded-lg">
                <i class="fa-solid fa-circle-check mr-2"></i>
                Pesan berhasil dikirim!
            </div>

            <form id="contactForm" class="space-y-5">

                <div>
                    <label class="block font-semibold mb-2">Nama Lengkap</label>
                    <input
                        type="text"
                        id="contactName"
                        required
                        placeholder="Masukkan nama lengkap"
                        class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block font-semibold mb-2">Email</label>
                    <input
                        type="email"
                        id="contactEmail"
                        required
                        placeholder="Masukkan email"
                        class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block font-semibold mb-2">Subjek</label>
                    <input
                        type="text"
                        id="contactSubject"
                        required
                        placeholder="Masukkan subjek pesan"
                        class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div>
                    <label class="block font-semibold mb-2">Pesan</label>
                    <textarea
                        id="contactMessage"
                        rows="5"
                        required
                        placeholder="Tuliskan pesan atau saran..."
                        class="w-full border rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg">
                    <i class="fa-solid fa-paper-plane mr-2"></i>
                    Kirim Pesan
                </button>

            </form>
        </div>
    </main>
</div>

<script>
    document.getElementById("contactForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const pesanBaru = {
            nama: document.getElementById("contactName").value.trim(),
            email: document.getElementById("contactEmail").value.trim(),
            subjek: document.getElementById("contactSubject").value.trim(),
            pesan: document.getElementById("contactMessage").value.trim(),
            tanggal: new Date().toLocaleString("id-ID"),
            dibaca: false
        };

        let daftarPesan = JSON.parse(localStorage.getItem("pesanMasuk")) || [];

        daftarPesan.push(pesanBaru);

        localStorage.setItem("pesanMasuk", JSON.stringify(daftarPesan));

        document.getElementById("successMessage").classList.remove("hidden");

        this.reset();
    });
</script>

</body>
</html>
