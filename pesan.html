<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Masuk | Campus Freelancer Network</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }

        .pesan-item {
            transition: 0.2s;
        }

        .pesan-item:hover {
            background: #f8fafc;
        }

        .pesan-item.unread {
            border-left: 4px solid #2563eb;
            background: #eff6ff;
        }
    </style>
</head>

<body class="text-gray-800">

<div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-slate-900 text-white p-6 hidden md:block">
        <h1 class="text-xl font-bold mb-10">
            Campus Freelancer
        </h1>

        <nav class="space-y-3">
            <a href="beranda.html" class="block p-3 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-house mr-2"></i> Beranda
            </a>

            <a href="freelance.html" class="block p-3 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-users mr-2"></i> Freelancer
            </a>

            <a href="profil.html" class="block p-3 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-user mr-2"></i> Profil
            </a>

            <a href="kontak.html" class="block p-3 rounded-lg hover:bg-slate-700">
                <i class="fa-solid fa-envelope mr-2"></i> Kontak
            </a>

            <a href="pesan.html" class="block p-3 rounded-lg bg-blue-600">
                <i class="fa-solid fa-inbox mr-2"></i> Pesan Masuk
                <span id="badgePesan" class="ml-2 bg-red-500 text-white text-xs px-2 py-1 rounded-full">0</span>
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-6 md:p-10">

        <div class="mb-8">
            <h2 class="text-3xl font-bold">Pesan Masuk</h2>
            <p class="text-gray-500 mt-2">
                Kelola pesan, pertanyaan, dan saran dari pengguna.
            </p>
        </div>

        <!-- STATISTIK -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">

            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-gray-500 text-sm">Total Pesan</p>
                <h3 id="totalPesan" class="text-3xl font-bold mt-2">0</h3>
            </div>

            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-gray-500 text-sm">Belum Dibaca</p>
                <h3 id="belumDibaca" class="text-3xl font-bold text-blue-600 mt-2">0</h3>
            </div>

            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-gray-500 text-sm">Sudah Dibaca</p>
                <h3 id="sudahDibaca" class="text-3xl font-bold text-green-600 mt-2">0</h3>
            </div>

        </div>

        <!-- SEARCH -->
        <div class="bg-white rounded-xl border p-5 mb-6">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
                <input
                    type="text"
                    id="searchPesan"
                    oninput="renderPesan()"
                    placeholder="Cari nama atau subjek pesan..."
                    class="w-full border rounded-lg pl-11 pr-4 py-3 outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <!-- DAFTAR PESAN -->
        <div class="bg-white rounded-xl border shadow-sm">

            <div class="p-5 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg">Daftar Pesan</h3>

                <button
                    onclick="renderPesan()"
                    class="text-blue-600 hover:text-blue-800 font-semibold">
                    <i class="fa-solid fa-rotate mr-1"></i>
                    Perbarui
                </button>
            </div>

            <div id="listPesan"></div>

            <div id="emptyPesan" class="hidden p-12 text-center">
                <i class="fa-solid fa-inbox text-5xl text-gray-300 mb-4"></i>
                <h3 class="font-bold text-lg">Belum Ada Pesan</h3>
                <p class="text-gray-500 mt-2">
                    Pesan yang dikirim melalui halaman Kontak akan muncul di sini.
                </p>
            </div>

        </div>

    </main>
</div>

<script>
    // MENGAMBIL DATA PESAN DARI LOCAL STORAGE
    let semuaPesan = JSON.parse(localStorage.getItem("pesanMasuk")) || [];

    // MENAMPILKAN PESAN
    function renderPesan() {

        const keyword = document.getElementById("searchPesan").value.toLowerCase();

        const list = document.getElementById("listPesan");
        const empty = document.getElementById("emptyPesan");

        const filtered = semuaPesan
            .map((pesan, index) => ({ ...pesan, index }))
            .filter(p =>
                p.nama.toLowerCase().includes(keyword) ||
                p.subjek.toLowerCase().includes(keyword)
            );

        // MENGHITUNG STATISTIK
        const belum = semuaPesan.filter(p => !p.dibaca).length;

        document.getElementById("totalPesan").textContent = semuaPesan.length;
        document.getElementById("belumDibaca").textContent = belum;
        document.getElementById("sudahDibaca").textContent = semuaPesan.length - belum;
        document.getElementById("badgePesan").textContent = belum;

        list.innerHTML = "";

        // JIKA PESAN KOSONG
        if (filtered.length === 0) {
            empty.classList.remove("hidden");
            return;
        }

        empty.classList.add("hidden");

        // MENAMPILKAN SETIAP PESAN
        filtered.forEach(p => {

            const div = document.createElement("div");

            div.className = "pesan-item p-5 border-b cursor-pointer " +
                (!p.dibaca ? "unread" : "");

            div.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between gap-4">

                    <div class="flex-1">

                        <div class="flex items-center gap-2 mb-2">
                            <h4 class="font-bold">${escapeHTML(p.nama)}</h4>

                            ${!p.dibaca
                                ? '<span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full">Baru</span>'
                                : '<span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">Dibaca</span>'
                            }
                        </div>

                        <p class="text-sm text-gray-500 mb-2">
                            ${escapeHTML(p.email)} • ${escapeHTML(p.tanggal)}
                        </p>

                        <p class="font-semibold mb-2">
                            ${escapeHTML(p.subjek)}
                        </p>

                        <p class="text-gray-600 text-sm">
                            ${escapeHTML(p.pesan)}
                        </p>

                    </div>

                    <div class="flex items-center">
                        <button
                            onclick="hapusPesan(${p.index})"
                            class="text-red-500 hover:text-red-700 px-3 py-2"
                            title="Hapus pesan">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>

                </div>
            `;

            div.addEventListener("click", function(e) {

                if (e.target.closest("button")) return;

                semuaPesan[p.index].dibaca = true;

                simpanPesan();
                renderPesan();

            });

            list.appendChild(div);
        });
    }

    // MENCEGAH TEKS INPUT DITAFSIRKAN SEBAGAI HTML
    function escapeHTML(teks) {
        return String(teks).replace(/[&<>"']/g, function(karakter) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[karakter];
        });
    }

    // MENYIMPAN DATA PESAN
    function simpanPesan() {
        localStorage.setItem("pesanMasuk", JSON.stringify(semuaPesan));
    }

    // MENGHAPUS PESAN
    function hapusPesan(index) {

        if (confirm("Apakah kamu yakin ingin menghapus pesan ini?")) {

            semuaPesan.splice(index, 1);

            simpanPesan();
            renderPesan();
        }
    }

    // MENAMPILKAN PESAN SAAT HALAMAN DIBUKA
    renderPesan();
</script>

</body>
</html>
