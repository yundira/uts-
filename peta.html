<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Freelancer - Campus Freelancer Network</title>

    <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background: white;
            border-right: 1px solid #e5e7eb;
            flex-shrink: 0;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: #64748b;
            margin-bottom: 5px;
            transition: .2s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #eff6ff;
            color: #2563eb;
        }

        #map {
            width: 100%;
            height: 540px;
            border-radius: 14px;
            z-index: 1;
        }

        .map-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
        }

        .filter-input {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 11px 13px;
            outline: none;
            background: white;
        }

        .filter-input:focus {
            border-color: #3b82f6;
        }

        .freelancer-item {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            transition: .2s;
            cursor: pointer;
        }

        .freelancer-item:hover {
            border-color: #93c5fd;
            background: #f8fbff;
        }

        @media(max-width: 768px) {
            .sidebar {
                display: none;
            }

            #map {
                height: 420px;
            }
        }
    </style>
</head>

<body>

<div class="flex min-h-screen">

    <!-- SIDEBAR -->
